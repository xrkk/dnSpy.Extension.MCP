name: Verify

# IMP-011 reusable verification gate. build.yml and release.yml both call this workflow and
# make packaging depend on it. Legs:
#   contracts  - frozen dnspy.debug.v1 schema + byte limits + 189 canonical fixtures
#                (deterministic regeneration + full invariant validation)
#   build      - net48 dependency guard + dual-TFM Release build on Windows
#   harness    - static driver/manifests/schema integrity check
#   e2e        - mandatory dynamic execution of all 36 ACC cases on the provisioned dedicated
#                Windows/dnSpy runner (both x86/x64 dnSpy and .NET hosts are required)
on:
  workflow_call:

env:
  DNSPY_REF: v6.6.0

jobs:
  contracts:
    name: Contract validation (schema + fixtures)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MCP Extension
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator
        run: pip install jsonschema

      - name: Validate frozen contract artifacts
        run: python tests/debug/contracts/validate.py

      - name: Test Python client and stdio bridge
        run: python -m unittest discover -s tests/python -v

      - name: Regenerate and diff static tool schema snapshot
        run: |
          python - <<'EOF'
          import json
          snap = json.load(open('tests/snapshots/static-tools.baseline.json'))
          assert len(snap) == 32, f"expected 32 static tools, got {len(snap)}"
          assert all(t.get('name') and t.get('description') and t.get('inputSchema') for t in snap)
          print('static tool snapshot: 32 tools, complete entries')
          EOF

  build:
    name: Dependency guard + dual-TFM Release build
    runs-on: windows-latest
    steps:
      - name: Checkout MCP Extension
        uses: actions/checkout@v4
        with:
          path: dnSpy.Extension.MCP

      - name: Checkout dnSpy (parent repository)
        uses: actions/checkout@v4
        with:
          repository: dnSpyEx/dnSpy
          ref: ${{ env.DNSPY_REF }}
          path: dnSpy
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Move extension to Extensions subdir
        shell: pwsh
        run: Move-Item -Path dnSpy.Extension.MCP -Destination dnSpy\Extensions\dnSpy.Extension.MCP -Force

      # net48 strict assembly binding guard (issue #21).
      - name: Check net48 dependency versions match dnSpy
        shell: pwsh
        working-directory: dnSpy\Extensions\dnSpy.Extension.MCP
        run: .\tests\check-host-deps.ps1 -Restore

      - name: Build extension (net48, Release)
        shell: pwsh
        working-directory: dnSpy\Extensions\dnSpy.Extension.MCP
        run: dotnet build -c Release -f net48

      - name: Build extension (net10.0-windows, Release)
        shell: pwsh
        working-directory: dnSpy\Extensions\dnSpy.Extension.MCP
        run: dotnet build -c Release -f net10.0-windows

      - name: Publish accepted net48 extension
        uses: actions/upload-artifact@v4
        with:
          name: accepted-extension-net48
          path: dnSpy/Extensions/dnSpy.Extension.MCP/bin/Release/net48/dnSpy.Extension.MCP.x.dll
          if-no-files-found: error

  harness:
    name: E2E harness integrity
    runs-on: windows-latest
    needs: [contracts, build]
    steps:
      - name: Checkout MCP Extension
        uses: actions/checkout@v4
        with:
          path: dnSpy.Extension.MCP

      - name: Checkout dnSpy (parent repository)
        uses: actions/checkout@v4
        with:
          repository: dnSpyEx/dnSpy
          ref: ${{ env.DNSPY_REF }}
          path: dnSpy
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Move extension to Extensions subdir
        shell: pwsh
        run: Move-Item -Path dnSpy.Extension.MCP -Destination dnSpy\Extensions\dnSpy.Extension.MCP -Force

      - name: Build extension (Release, both TFMs)
        shell: pwsh
        working-directory: dnSpy\Extensions\dnSpy.Extension.MCP
        run: dotnet build -c Release

      - name: Build six launch fixtures
        shell: pwsh
        working-directory: dnSpy\Extensions\dnSpy.Extension.MCP
        run: .\tests\debug\fixtures\build-launch-fixtures.ps1

      - name: Run E2E harness gate (-VerifyHarness, static)
        shell: pwsh
        working-directory: dnSpy\Extensions\dnSpy.Extension.MCP
        run: .\tests\debug\run-debug-tests.ps1 -VerifyHarness

  e2e:
    name: Dynamic E2E (36 ACC / six runtime legs)
    runs-on: [self-hosted, Windows, X64, dnspy-e2e]
    needs: [contracts, build, harness]
    timeout-minutes: 180
    steps:
      - name: Checkout MCP Extension
        uses: actions/checkout@v4

      - name: Setup Python client runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify dedicated runner prerequisites
        shell: pwsh
        run: |
          $required = @(
            'C:\Tools\dnSpy\dnSpy.exe',
            'C:\Tools\dnSpy\dnSpy-x86.exe',
            'C:\Tools\MefCheck\dotnet10-x64\dotnet.exe',
            'C:\Tools\dotnet10-x86\dotnet.exe'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count) { throw "dedicated dnSpy E2E runner is missing: $($missing -join ', ')" }

      - name: Download accepted extension build
        uses: actions/download-artifact@v4
        with:
          name: accepted-extension-net48
          path: _accepted

      - name: Deploy accepted extension build
        shell: pwsh
        run: |
          Get-Process dnSpy -ErrorAction SilentlyContinue | Stop-Process -Force
          $deadline = (Get-Date).AddSeconds(15)
          while ((Get-Process dnSpy -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 100 }
          if (Get-Process dnSpy -ErrorAction SilentlyContinue) { throw 'dnSpy did not stop before extension deployment' }
          $target = 'C:\Tools\dnSpy\bin\Extensions\dnSpy.Extension.MCP'
          New-Item -ItemType Directory -Force $target | Out-Null
          $dll = Get-ChildItem _accepted -Recurse -Filter dnSpy.Extension.MCP.x.dll | Select-Object -First 1
          if (-not $dll) { throw 'net48 extension artifact not present on the dedicated runner' }
          Copy-Item $dll.FullName $target -Force

      - name: Execute all dynamic acceptance cases
        shell: pwsh
        run: |
          $failed = @()
          1..36 | ForEach-Object {
            $case = 'ACC-{0:d3}' -f $_
            & .\tests\debug\run-debug-tests.ps1 -Case $case
            if ($LASTEXITCODE -ne 0) { $failed += "$case(exit=$LASTEXITCODE)" }
          }
          if ($failed.Count) { throw "dynamic acceptance failures: $($failed -join ', ')" }

      - name: Upload dynamic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnspy-debug-acceptance-${{ github.sha }}
          path: tests/debug/results/${{ github.sha }}
          if-no-files-found: error

  verify-status:
    name: Verify Status
    needs: [contracts, build, harness, e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check verify result
        run: |
          # Hard gate: anything but success — including 'skipped' — fails verification.
          # (Static references: GitHub Actions has no dynamic needs.jobs[job] indexing.)
          if [ "${{ needs.contracts.result }}" != "success" ] \
             || [ "${{ needs.build.result }}" != "success" ] \
             || [ "${{ needs.harness.result }}" != "success" ] \
             || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "verify did not succeed: contracts=${{ needs.contracts.result }} build=${{ needs.build.result }} harness=${{ needs.harness.result }} e2e=${{ needs.e2e.result }}"
            exit 1
          fi
          echo "Verify completed successfully!"
